<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMR 2026 | Publication Proceedings</title>
    
    <!-- Dependencies: PDF Engine & Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1b18 0%, #0d0b0a 100%);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Conference Header Bar */
        header {
            height: 56px;
            background-color: #14110f;
            border-bottom: 1px solid #2d2621;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .album-badge {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #14110f;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .title-text h1 {
            color: #f3ece7;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .title-text p {
            color: #a39589;
            font-size: 0.75rem;
        }

        /* Main Viewport & Single Page Canvas */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        .page-card {
            position: relative;
            background-color: #ffffff;
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(212, 175, 55, 0.2);
            max-height: calc(100vh - 140px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }

        #pdf-canvas {
            display: block;
            max-height: calc(100vh - 140px);
            max-width: 100%;
            height: auto;
            width: auto;
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            color: #d4af37;
            text-align: center;
            font-size: 0.95rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Floating Controls Toolbar */
        .toolbar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 17, 15, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .btn-ctrl {
            background: none;
            border: none;
            color: #c5b5a7;
            font-size: 1.1rem;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .btn-ctrl:hover {
            color: #d4af37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .page-indicator {
            color: #e5dace;
            font-size: 0.9rem;
            font-weight: 500;
            min-width: 90px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="album-badge">ICMR 2026</span>
            <div class="title-text">
                <h1>23rd International Conference on Manufacturing Research</h1>
                <p>2–4 September 2026 &bull; Astana, Kazakhstan</p>
            </div>
        </div>
        <a href="icmr2026-proceedings.pdf" download style="color:#d4af37; text-decoration:none; font-size:0.85rem; font-weight:600;">
            <i class="fa-solid fa-file-pdf"></i> Download PDF
        </a>
    </header>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            Loading Document...
        </div>
        
        <div class="page-card" id="page-card" title="Click to turn page">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div class="toolbar">
            <button class="btn-ctrl" id="btn-prev" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="page-indicator" id="page-num">Page 1 of 1</span>
            <button class="btn-ctrl" id="btn-next" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        // PDF File Name - must match your uploaded PDF in GitHub
        const PDF_FILE = 'icmr2026-proceedings.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const pageNumDisplay = document.getElementById('page-num');
        const loader = document.getElementById('loader');

        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(page => {
                // High-DPI crisp scale rendering
                const viewport = page.getViewport({ scale: 2.0 });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                const renderTask = page.render(renderContext);
                renderTask.promise.then(() => {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            pageNumDisplay.innerText = `Page ${num} of ${pdfDoc.numPages}`;
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        function onPrevPage() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        }

        function onNextPage() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        }

        document.getElementById('btn-prev').addEventListener('click', onPrevPage);
        document.getElementById('btn-next').addEventListener('click', onNextPage);

        // Click anywhere on the page to advance
        document.getElementById('page-card').addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                onNextPage();
            } else {
                onPrevPage();
            }
        });

        // Keyboard arrow navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') onNextPage();
            if (e.key === 'ArrowLeft') onPrevPage();
        });

        // Load PDF Document
        pdfjsLib.getDocument(PDF_FILE).promise.then(pdf => {
            pdfDoc = pdf;
            loader.style.display = 'none';
            renderPage(pageNum);
        }).catch(err => {
            loader.innerHTML = '<p style="color:#f87171;">File not found. Verify "icmr2026-proceedings.pdf" is uploaded to GitHub.</p>';
        });
    </script>

</body>
</html>
