<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMR 2026 | 23rd International Conference on Manufacturing Research</title>
    
    <!-- Dependencies: PDF Engine & 3D Page Flip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0f19;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Conference Navigation Bar */
        header {
            height: 56px;
            background-color: #111827;
            border-bottom: 1px solid #1f2937;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 20;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .badge {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }
        .title-text h1 {
            color: #f3f4f6;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .title-text p {
            color: #9ca3af;
            font-size: 0.75rem;
        }

        /* Main Viewport & Magazine Container */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }
        .magazine-wrapper {
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }
        .page {
            background-color: #ffffff;
            overflow: hidden;
        }
        .page canvas {
            width: 100%;
            height: 100%;
        }

        /* Loading Indicator */
        #loader {
            position: absolute;
            color: #f8fafc;
            text-align: center;
            font-size: 0.9rem;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 12px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Floating Toolbar Controls */
        .toolbar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(17, 24, 39, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 30;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }
        .btn-ctrl {
            background: none;
            border: none;
            color: #9ca3af;
            font-size: 1rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .btn-ctrl:hover {
            color: #ffffff;
            background-color: rgba(255,255,255,0.1);
        }
        .page-indicator {
            color: #d1d5db;
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="badge">ICMR 2026</span>
            <div class="title-text">
                <h1>23rd International Conference on Manufacturing Research</h1>
                <p>2–4 September 2026 &bull; Astana, Kazakhstan</p>
            </div>
        </div>
        <a href="icmr2026-proceedings.pdf" download style="color:#60a5fa; text-decoration:none; font-size:0.85rem; font-weight:600;">
            <i class="fa-solid fa-download"></i> PDF
        </a>
    </header>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            Loading ICMR 2026 Magazine...
        </div>
        
        <div id="magazine" class="magazine-wrapper"></div>

        <div class="toolbar">
            <button class="btn-ctrl" id="btn-prev" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="page-indicator" id="page-num">1 / 1</span>
            <button class="btn-ctrl" id="btn-next" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        // Make sure this filename matches your PDF in the GitHub repository
        const PDF_FILE = 'icmr2026-proceedings.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function renderFlipbook() {
            const loader = document.getElementById('loader');
            const container = document.getElementById('magazine');
            
            try {
                const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    container.appendChild(pageDiv);
                }

                loader.style.display = 'none';

                // Initialize 3D Magazine Page-Flip Engine
                const pageFlip = new St.PageFlip(container, {
                    width: 500,
                    height: 680,
                    size: "stretch",
                    minWidth: 300,
                    maxWidth: 900,
                    minHeight: 400,
                    maxHeight: 1200,
                    maxShadowOpacity: 0.6,
                    showCover: true,
                    mobileScrollSupport: false
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                // Controls Binding
                const numDisplay = document.getElementById('page-num');
                const updateNum = () => {
                    numDisplay.innerText = `${pageFlip.getCurrentPageIndex() + 1} / ${totalPages}`;
                };

                document.getElementById('btn-prev').onclick = () => { pageFlip.flipPrev(); updateNum(); };
                document.getElementById('btn-next').onclick = () => { pageFlip.flipNext(); updateNum(); };

                pageFlip.on('flip', () => updateNum());
                updateNum();

            } catch (err) {
                loader.innerHTML = '<p style="color:#f87171;">Unable to load PDF. Check that "icmr2026-proceedings.pdf" is in your repository root.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', renderFlipbook);
    </script>

</body>
</html>
