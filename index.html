<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMR 2026 | Slide Presentation</title>
    
    <!-- Dependencies: PDF Engine & Icons -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        header {
            height: 50px;
            background-color: #1e293b;
            border-bottom: 1px solid #334155;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }
        .brand-title {
            color: #f8fafc;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .download-link {
            color: #38bdf8;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
        }

        /* Slide Stage Container */
        #slide-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 15px;
            cursor: pointer;
            overflow: hidden;
        }

        /* Slide Canvas - Perfect Aspect Ratio */
        #pdf-canvas {
            display: block;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 4px;
            background-color: #ffffff;
        }

        /* Loading Spinner */
        #loader {
            position: absolute;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
        }
        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* PPT Control Toolbar */
        .controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            border-radius: 40px;
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 20;
        }
        .btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn:hover {
            background-color: #38bdf8;
            color: #0f172a;
            border-color: #38bdf8;
        }
        .slide-counter {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            min-width: 90px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-title">ICMR 2026 Proceedings</div>
        <a href="icmr2026-proceedings.pdf" download class="download-link">
            <i class="fa-solid fa-download"></i> Download PDF
        </a>
    </header>

    <div id="slide-container" title="Click anywhere to advance slide">
        <div id="loader">
            <div class="spinner"></div>
            Loading Presentation...
        </div>
        
        <canvas id="pdf-canvas"></canvas>

        <div class="controls" onclick="event.stopPropagation()">
            <button class="btn" id="btn-prev"><i class="fa-solid fa-arrow-left"></i> Prev</button>
            <span class="slide-counter" id="slide-counter">Slide 1</span>
            <button class="btn" id="btn-next">Next <i class="fa-solid fa-arrow-right"></i></button>
        </div>
    </div>

    <script>
        const PDF_FILE = 'icmr2026-proceedings.pdf'; // Must match your uploaded PDF name

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        let pdfDoc = null;
        let currentSlide = 1;
        let isRendering = false;

        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('slide-container');
        const counter = document.getElementById('slide-counter');
        const loader = document.getElementById('loader');

        function renderSlide(slideNum) {
            isRendering = true;
            pdfDoc.getPage(slideNum).then(page => {
                const unscaledViewport = page.getViewport({ scale: 1.0 });

                // Calculate exact scaling to fit slide in viewport without any distortion
                const padding = 60;
                const availableWidth = container.clientWidth - padding;
                const availableHeight = container.clientHeight - padding - 40;

                const scaleX = availableWidth / unscaledViewport.width;
                const scaleY = availableHeight / unscaledViewport.height;
                const scale = Math.min(scaleX, scaleY); // Maintain 100% natural aspect ratio

                const dpr = window.devicePixelRatio || 1;
                const viewport = page.getViewport({ scale: scale * dpr });

                canvas.width = viewport.width;
                canvas.height = viewport.height;
                canvas.style.width = (viewport.width / dpr) + 'px';
                canvas.style.height = (viewport.height / dpr) + 'px';

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(() => {
                    isRendering = false;
                    loader.style.display = 'none';
                });
            });

            counter.innerText = `Slide ${slideNum} of ${pdfDoc.numPages}`;
        }

        function nextSlide() {
            if (currentSlide >= pdfDoc.numPages || isRendering) return;
            currentSlide++;
            renderSlide(currentSlide);
        }

        function prevSlide() {
            if (currentSlide <= 1 || isRendering) return;
            currentSlide--;
            renderSlide(currentSlide);
        }

        // Click Controls
        document.getElementById('btn-next').addEventListener('click', nextSlide);
        document.getElementById('btn-prev').addEventListener('click', prevSlide);

        // Click slide area to advance (like PPT)
        container.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            if (clickX > rect.width / 2) {
                nextSlide();
            } else {
                prevSlide();
            }
        });

        // Keyboard navigation (Arrow keys / Spacebar)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') nextSlide();
            if (e.key === 'ArrowLeft' || e.key === 'PageUp') prevSlide();
        });

        // Resize handler to re-scale dynamically
        window.addEventListener('resize', () => {
            if (pdfDoc) renderSlide(currentSlide);
        });

        // Load Document
        pdfjsLib.getDocument(PDF_FILE).promise.then(pdf => {
            pdfDoc = pdf;
            renderSlide(currentSlide);
        }).catch(err => {
            loader.innerHTML = '<p style="color:#ef4444;">PDF missing. Verify "icmr2026-proceedings.pdf" is in GitHub repository.</p>';
        });
    </script>

</body>
</html>
