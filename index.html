<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICMR 2026 | Conference Album & Proceedings</title>
    
    <!-- Dependencies: PDF Engine & 3D Album Flip Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1b18 0%, #0d0b0a 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Deluxe Header Header Bar */
        header {
            height: 60px;
            background-color: #14110f;
            border-bottom: 1px solid #2d2621;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 20;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .album-badge {
            background: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
            color: #14110f;
            font-size: 0.75rem;
            font-weight: 800;
            padding: 5px 10px;
            border-radius: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: system-ui, sans-serif;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }
        .title-text h1 {
            color: #f3ece7;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        .title-text p {
            color: #a39589;
            font-size: 0.75rem;
            font-family: system-ui, sans-serif;
        }

        /* Album Viewport */
        #viewport {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
            overflow: hidden;
        }

        /* Book Shadow & Outer Frame */
        .book-stage {
            position: relative;
            padding: 12px;
            background: #191411;
            border-radius: 8px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8), 
                        inset 0 0 0 1px rgba(212, 175, 55, 0.2);
        }

        .magazine-wrapper {
            position: relative;
        }

        /* Center Book Spine Line */
        .book-stage::after {
            content: '';
            position: absolute;
            top: 12px;
            bottom: 12px;
            left: 50%;
            width: 4px;
            transform: translateX(-50%);
            background: linear-gradient(to right, rgba(0,0,0,0.4), rgba(0,0,0,0.1), rgba(0,0,0,0.4));
            z-index: 10;
            pointer-events: none;
        }

        .page {
            background-color: #fdfbf7;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.05);
        }
        .page canvas {
            width: 100%;
            height: 100%;
        }

        /* Loading Indicator */
        #loader {
            position: absolute;
            color: #d4af37;
            text-align: center;
            font-size: 0.95rem;
            font-family: system-ui, sans-serif;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(212, 175, 55, 0.1);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Album Toolbar */
        .toolbar {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 17, 15, 0.9);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 30px;
            padding: 6px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 30;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            font-family: system-ui, sans-serif;
        }
        .btn-ctrl {
            background: none;
            border: none;
            color: #c5b5a7;
            font-size: 1.05rem;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: all 0.2s;
        }
        .btn-ctrl:hover {
            color: #d4af37;
            background-color: rgba(212, 175, 55, 0.1);
        }
        .page-indicator {
            color: #e5dace;
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 80px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <span class="album-badge">ICMR 2026</span>
            <div class="title-text">
                <h1>23rd International Conference on Manufacturing Research</h1>
                <p>2–4 September 2026 &bull; Astana, Kazakhstan</p>
            </div>
        </div>
        <a href="icmr2026-proceedings.pdf" download style="color:#d4af37; text-decoration:none; font-size:0.85rem; font-family:system-ui, sans-serif; font-weight:600;">
            <i class="fa-solid fa-file-pdf"></i> Download Album PDF
        </a>
    </header>

    <div id="viewport">
        <div id="loader">
            <div class="spinner"></div>
            Opening ICMR 2026 Conference Album...
        </div>
        
        <div class="book-stage">
            <div id="magazine" class="magazine-wrapper"></div>
        </div>

        <div class="toolbar">
            <button class="btn-ctrl" id="btn-prev" title="Previous Page"><i class="fa-solid fa-chevron-left"></i></button>
            <span class="page-indicator" id="page-num">Page 1</span>
            <button class="btn-ctrl" id="btn-next" title="Next Page"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
    </div>

    <script>
        // Ensure this PDF file name matches the actual file uploaded in your repository
        const PDF_FILE = 'icmr2026-proceedings.pdf'; 

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        async function renderBook() {
            const loader = document.getElementById('loader');
            const container = document.getElementById('magazine');
            
            try {
                const pdf = await pdfjsLib.getDocument(PDF_FILE).promise;
                const totalPages = pdf.numPages;

                for (let i = 1; i <= totalPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    
                    const pageDiv = document.createElement('div');
                    pageDiv.className = 'page';
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;
                    
                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    pageDiv.appendChild(canvas);
                    container.appendChild(pageDiv);
                }

                loader.style.display = 'none';

                // Initialize 3D Hardcover Album Engine
                const pageFlip = new St.PageFlip(container, {
                    width: 480,
                    height: 640,
                    size: "stretch",
                    minWidth: 320,
                    maxWidth: 800,
                    minHeight: 420,
                    maxHeight: 1100,
                    maxShadowOpacity: 0.7,
                    showCover: true,
                    mobileScrollSupport: false,
                    drawShadow: true,
                    flippingTime: 900
                });

                pageFlip.loadFromHTML(document.querySelectorAll('.page'));

                const numDisplay = document.getElementById('page-num');
                const updateNum = () => {
                    numDisplay.innerText = `Page ${pageFlip.getCurrentPageIndex() + 1} of ${totalPages}`;
                };

                document.getElementById('btn-prev').onclick = () => { pageFlip.flipPrev(); updateNum(); };
                document.getElementById('btn-next').onclick = () => { pageFlip.flipNext(); updateNum(); };

                pageFlip.on('flip', () => updateNum());
                updateNum();

            } catch (err) {
                loader.innerHTML = '<p style="color:#f87171;">Unable to load publication PDF. Verify "icmr2026-proceedings.pdf" exists in your GitHub repository.</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', renderBook);
    </script>

</body>
</html>
